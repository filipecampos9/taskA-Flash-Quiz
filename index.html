<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Quiz</title>
<style>
  :root {
    --ink: #161616; --paper: #fffaf0; --bg: #ffd23f;
    --ok: #1fbf75; --bad: #ff5a5f; --muted: #6b6457;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink);
    background: var(--bg) radial-gradient(var(--ink) 1px, transparent 1.5px) 0 0 / 22px 22px;
  }
  .card {
    width: 100%; max-width: 640px; background: var(--paper); padding: 2rem;
    border: 3px solid var(--ink); border-radius: 20px; box-shadow: 8px 8px 0 var(--ink);
  }
  h1 { margin: 0 0 1rem; font-size: 2.2rem; font-weight: 900; letter-spacing: -.02em; }
  h1 span { background: var(--ink); color: var(--bg); padding: 0 .35em; border-radius: 8px; }
  #meta { display: flex; justify-content: space-between; font-weight: 700; color: var(--muted); }
  #score { background: var(--ink); color: var(--paper); padding: .15em .7em; border-radius: 99px; }
  #timer { height: 14px; border: 3px solid var(--ink); border-radius: 99px; overflow: hidden; margin: .9rem 0 1.6rem; background: #fff; }
  #bar { height: 100%; width: 100%; background: var(--ok); transition: background .3s; }
  #bar.pouco { background: var(--bad); }
  #q { font-size: 1.5rem; font-weight: 800; line-height: 1.3; margin: 0 0 1.2rem; }

  #answers { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; counter-reset: opt; }
  @media (max-width: 520px) { #answers { grid-template-columns: 1fr; } }
  button {
    display: flex; align-items: center; gap: .7rem; width: 100%; padding: .9rem 1rem;
    font: inherit; font-weight: 700; font-size: 1.05rem; text-align: left; color: var(--ink);
    background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer; transition: transform .08s, box-shadow .08s;
  }
  button:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid #3a6cf4; outline-offset: 3px; }
  button:disabled { cursor: default; }
  #answers button:disabled:not(.certa):not(.errada) { opacity: .45; }
  #answers button:not(#restart)::before {
    counter-increment: opt; content: counter(opt, upper-alpha);
    flex: none; display: grid; place-items: center; width: 2rem; height: 2rem;
    border-radius: 8px; background: var(--bg); border: 2px solid var(--ink); font-weight: 900;
  }
  .certa { background: var(--ok); color: #fff; animation: pop .3s; }
  .errada { background: var(--bad); color: #fff; animation: shake .35s; }
  @keyframes pop { 50% { transform: scale(1.05); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  #feedback { min-height: 1.6em; margin: 1.2rem 0 .6rem; font-size: 1.2rem; font-weight: 900; }
  #next, #restart { justify-content: center; background: var(--ink); color: var(--bg); font-size: 1.15rem; }
  #restart { grid-column: 1 / -1; }
  [hidden] { display: none !important; } /* senão `display` dos botões anula o atributo hidden */
</style>
</head>
<body>
<div class="card">
  <h1><span>Flash</span> Quiz</h1>
  <div id="meta"><span id="progress"></span><span id="score"></span></div>
  <div id="timer"><div id="bar"></div></div>
  <main id="game">
    <p id="q"></p>
    <div id="answers"></div>
    <p id="feedback" aria-live="polite"></p>
    <button id="next" hidden>Próxima</button>
  </main>
</div>
<script>
const TEMPO = 15; // segundos por pergunta
const PERGUNTAS = [
  ["Qual é a capital de Portugal?", ["Lisboa", "Porto", "Coimbra", "Braga"], 0],
  ["Quantos planetas tem o Sistema Solar?", ["7", "8", "9", "10"], 1],
  ["Quem escreveu 'Os Lusíadas'?", ["Fernando Pessoa", "Eça de Queirós", "Luís de Camões", "José Saramago"], 2],
  ["Qual é o símbolo químico do ouro?", ["Ag", "Au", "Fe", "Go"], 1],
  ["Em que ano chegou Vasco da Gama à Índia?", ["1492", "1500", "1498", "1510"], 2],
  ["Qual é o maior oceano do mundo?", ["Atlântico", "Índico", "Ártico", "Pacífico"], 3],
  ["Quanto é 7 × 8?", ["54", "56", "64", "48"], 1],
  ["Qual é o rio mais longo da Península Ibérica?", ["Douro", "Tejo", "Guadiana", "Ebro"], 1],
  ["Que linguagem corre nativamente no browser?", ["Python", "Java", "JavaScript", "C#"], 2],
  ["Qual é o planeta conhecido como 'planeta vermelho'?", ["Vénus", "Júpiter", "Marte", "Saturno"], 2],
];

const $ = id => document.getElementById(id);
let ordem, i, pontos, fim, tick;

function iniciar() {
  ordem = [...PERGUNTAS].sort(() => Math.random() - .5); // ponytail: baralhar enviesado, chega para 10 perguntas
  i = 0; pontos = 0;
  mostrar();
}

function mostrar() {
  const [texto, opcoes] = ordem[i];
  $("progress").textContent = `Pergunta ${i + 1}/${ordem.length}`;
  $("score").textContent = `${pontos} pts`;
  $("q").textContent = texto;
  $("feedback").textContent = "";
  $("next").hidden = true;
  $("timer").hidden = false;
  $("answers").replaceChildren(...opcoes.map((o, k) => {
    const b = document.createElement("button");
    b.textContent = o;
    b.onclick = () => responder(k);
    return b;
  }));
  fim = Date.now() + TEMPO * 1000;
  clearInterval(tick);
  tick = setInterval(() => {
    const resta = Math.max(0, fim - Date.now()) / (TEMPO * 1000);
    $("bar").style.width = resta * 100 + "%";
    $("bar").classList.toggle("pouco", resta < .3);
    if (resta === 0) responder(-1);
  }, 50);
}

function responder(k) {
  clearInterval(tick);
  const certa = ordem[i][2];
  const botoes = $("answers").children;
  for (const b of botoes) b.disabled = true;
  botoes[certa].classList.add("certa");
  if (k === certa) {
    pontos++;
    $("feedback").textContent = "Certo!";
  } else {
    if (k >= 0) botoes[k].classList.add("errada");
    $("feedback").textContent = k < 0 ? "Tempo esgotado!" : "Errado!";
  }
  $("score").textContent = `${pontos} pts`;
  $("next").hidden = false;
  $("next").textContent = i + 1 < ordem.length ? "Próxima" : "Ver resultado";
  $("next").focus();
}

$("next").onclick = () => (++i < ordem.length ? mostrar() : resultado());

function resultado() {
  $("progress").textContent = "Fim!";
  $("timer").hidden = true;
  $("q").textContent = `Acertaste ${pontos} de ${ordem.length}.`;
  $("feedback").textContent = "";
  const b = document.createElement("button");
  b.id = "restart";
  b.textContent = "Jogar outra vez";
  b.onclick = iniciar;
  $("answers").replaceChildren(b);
  $("next").hidden = true;
}

iniciar();
</script>
</body>
</html>
